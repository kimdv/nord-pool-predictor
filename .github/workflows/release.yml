name: Release

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  docker-ci:
    uses: ./.github/workflows/docker-ci.yml

  publish-images:
    needs: [backend-ci, frontend-ci, docker-ci]
    runs-on: ubuntu-latest

    # The lock prevents concurrent tag writes; the head check handles arbitrary queue order.
    concurrency:
      group: release-publish-main
      queue: max
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Check this revision is still main
        id: current
        shell: bash
        run: |
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped superseded revision $GITHUB_SHA; main is $main_sha." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Log in to container registry
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.current.outputs.publish == 'true'
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-app:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-app:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push web image
        if: steps.current.outputs.publish == 'true'
        id: web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-web:latest
            ${{ env.REGISTRY }}/${{ github.repository }}-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record deployment digests
        if: steps.current.outputs.publish == 'true'
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          echo "Revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Backend (app and worker): $REGISTRY/$GITHUB_REPOSITORY-app@$BACKEND_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Web: $REGISTRY/$GITHUB_REPOSITORY-web@$WEB_DIGEST" >> "$GITHUB_STEP_SUMMARY"
