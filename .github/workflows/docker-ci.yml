name: Docker CI

on:
  workflow_call:
  pull_request:
    branches: [main]

jobs:
  build-images:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d testdb"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Verify Compose PostgreSQL persistence after recreation
        shell: bash
        env:
          COMPOSE_PROJECT_NAME: persistence-${{ github.run_id }}-${{ github.run_attempt }}
          NORDPOOL_DB_USER: nordpool
          NORDPOOL_DB_PASSWORD: persistence-test-only
        run: |
          # This project and its volumes are disposable CI storage only.
          trap 'docker compose down --volumes' EXIT
          docker compose up -d --wait postgres
          original_container=$(docker compose ps -q postgres)
          docker compose exec -T postgres psql -U nordpool -d nordpool -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE persistence_sentinel (value text); INSERT INTO persistence_sentinel VALUES ('survived');"
          docker compose up -d --wait --force-recreate --renew-anon-volumes postgres
          test "$original_container" != "$(docker compose ps -q postgres)"
          test "$(docker compose exec -T postgres psql -U nordpool -d nordpool -At -v ON_ERROR_STOP=1 \
            -c 'SELECT value FROM persistence_sentinel')" = survived

      - name: Build backend image
        run: docker build -t nordpool-predictor-app:ci ./backend

      - name: Load synchronous driver without a database
        run: docker run --rm nordpool-predictor-app:ci python scripts/check_database.py

      - name: Check sync and async connections against PostgreSQL 18
        run: >-
          docker run --rm --network host
          -e DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/testdb
          nordpool-predictor-app:ci python scripts/check_database.py --connect

      - name: Build web image
        run: docker build -t nordpool-predictor-web:ci ./web
